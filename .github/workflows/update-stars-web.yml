name: build starred web data

on:
  workflow_dispatch:
  push:
    branches:
      - starred-web
    paths:
      - ".github/workflows/update-stars-web.yml"
      - "assets/**"
      - "index.html"
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write

jobs:
  build-stars-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fetch starred repositories with metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          user = os.environ["GH_USER"]
          page = 1
          repos = []

          while True:
              url = f"https://api.github.com/users/{user}/starred?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github.star+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "technoluc-starred-pages"
              })
              with urllib.request.urlopen(req) as resp:
                  rows = json.load(resp)

              if not rows:
                  break

              for row in rows:
                  repo = row.get("repo", row)
                  owner = repo.get("owner") or {}
                  repos.append({
                      "name": repo.get("name"),
                      "full_name": repo.get("full_name"),
                      "html_url": repo.get("html_url"),
                      "description": repo.get("description"),
                      "language": repo.get("language"),
                      "topics": repo.get("topics") or [],
                      "stargazers_count": repo.get("stargazers_count", 0),
                      "forks_count": repo.get("forks_count", 0),
                      "archived": repo.get("archived", False),
                      "homepage": repo.get("homepage"),
                      "updated_at": repo.get("updated_at"),
                      "starred_at": row.get("starred_at"),
                      "owner": owner.get("login"),
                      "avatar_url": owner.get("avatar_url")
                  })

              page += 1

          payload = {
              "generated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "count": len(repos),
              "repositories": repos
          }

          with open("data/stars.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stars.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh starred web data"
          git push origin HEAD:${GITHUB_REF_NAME}
