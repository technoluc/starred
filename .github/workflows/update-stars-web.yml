name: build starred web data

on:
  workflow_dispatch:
  push:
    branches:
      - starred-web
    paths:
      - ".github/workflows/update-stars-web.yml"
      - "assets/**"
      - "index.html"
  workflow_call:

permissions:
  contents: write

concurrency:
  group: starred-web-data
  cancel-in-progress: false

jobs:
  build-stars-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starred-web

      - name: Fetch starred repositories with metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          token = os.environ["GH_TOKEN"]
          user = os.environ["GH_USER"]
          page = 1
          repos = []

          while True:
              url = f"https://api.github.com/users/{user}/starred?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github.star+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "technoluc-starred-pages"
              })
              with urllib.request.urlopen(req) as resp:
                  rows = json.load(resp)

              if not rows:
                  break

              for row in rows:
                  repo = row.get("repo", row)
                  owner = repo.get("owner") or {}
                  license_info = repo.get("license") or {}
                  repos.append({
                      "name": repo.get("name"),
                      "full_name": repo.get("full_name"),
                      "html_url": repo.get("html_url"),
                      "description": repo.get("description"),
                      "language": repo.get("language"),
                      "topics": repo.get("topics") or [],
                      "stargazers_count": repo.get("stargazers_count", 0),
                      "forks_count": repo.get("forks_count", 0),
                      "watchers_count": repo.get("watchers_count", 0),
                      "open_issues_count": repo.get("open_issues_count", 0),
                      "archived": repo.get("archived", False),
                      "disabled": repo.get("disabled", False),
                      "fork": repo.get("fork", False),
                      "homepage": repo.get("homepage"),
                      "visibility": repo.get("visibility"),
                      "default_branch": repo.get("default_branch"),
                      "size": repo.get("size"),
                      "created_at": repo.get("created_at"),
                      "updated_at": repo.get("updated_at"),
                      "pushed_at": repo.get("pushed_at"),
                      "starred_at": row.get("starred_at"),
                      "license": {
                          "name": license_info.get("name"),
                          "spdx_id": license_info.get("spdx_id")
                      } if license_info else None,
                      "owner": owner.get("login"),
                      "avatar_url": owner.get("avatar_url")
                  })

              page += 1

          now = datetime.now(timezone.utc)
          try:
              with open("data/stars.json", encoding="utf-8") as f:
                  previous = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              previous = {}

          old_stars = {(r.get("full_name"), r.get("starred_at")) for r in previous.get("repositories", [])}
          new_stars = {(r.get("full_name"), r.get("starred_at")) for r in repos}
          last_refresh = datetime.fromisoformat(previous.get("generated_at", "1970-01-01T00:00:00+00:00").replace("Z", "+00:00"))

          if (previous and old_stars == new_stars
                  and now - last_refresh < timedelta(hours=24)
                  and os.environ.get("FORCE_REFRESH", "").lower() != "true"):
              print("No star changes; metadata was refreshed less than 24 hours ago. Skipping commit.")
              raise SystemExit(0)

          payload = {
              "generated_at": now.isoformat(),
              "count": len(repos),
              "repositories": repos
          }

          with open("data/stars.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stars.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh starred web data"
          git push origin HEAD:starred-web
